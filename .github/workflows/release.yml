name: Release

# Builds WebMIX 0.1.0-style releases for Windows, Debian/Ubuntu (.deb) and Arch
# Linux (package + pacman repository) and publishes them as GitHub release
# assets.
#
#   git tag 0.1.0 && git push origin 0.1.0
#
# pushes a tag, which builds everything and creates the release. The manual
# trigger builds the same artifacts without publishing unless "publish" is set,
# which is the way to check a change to this workflow.

on:
  push:
    # Both spellings: OBS's own CI derives its version from the tag and rejects a
    # leading "v", so 0.1.0 is the tag to prefer, but v0.1.0 is accepted here too.
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (without the leading "v")
        required: true
        default: '0.1.0'
      publish:
        description: Create/update the GitHub release with the artifacts
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Re-tagging the same version (a fixed build) supersedes the older run instead
  # of queueing behind it.
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version 🔖
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Read the version 📖
        id: version
        run: |
          : Read the version 📖
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::'${version}' is not a version number"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building WebMIX ${version}" >> "$GITHUB_STEP_SUMMARY"

  deb:
    name: Debian/Ubuntu 📦
    runs-on: ubuntu-26.04
    needs: version
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies 🛍️
        run: |
          : Install build dependencies 🛍️
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake curl dh-cmake dpkg-dev extra-cmake-modules git jq \
            libglib2.0-dev lsb-release ninja-build pkg-config \
            libcurl4-openssl-dev \
            libavcodec-dev libavdevice-dev libavfilter-dev libavformat-dev libavutil-dev \
            libswresample-dev libswscale-dev \
            libjansson-dev libx11-xcb-dev libgles2-mesa-dev libwayland-dev \
            libpipewire-0.3-dev libpulse-dev libx264-dev libmbedtls-dev libgl1-mesa-dev \
            uthash-dev libsimde-dev libluajit-5.1-dev python3-dev \
            libx11-dev libxcb-randr0-dev libxcb-shm0-dev libxcb-xinerama0-dev \
            libxcb-composite0-dev libxinerama-dev libxcb1-dev libxcb-xfixes0-dev \
            swig libcmocka-dev libxss-dev libglvnd-dev \
            libxkbcommon-dev libatk1.0-dev libatk-bridge2.0-dev libxcomposite-dev \
            libxdamage-dev libasound2-dev libfdk-aac-dev libfontconfig-dev \
            libfreetype6-dev libjack-jackd2-dev libsndio-dev libspeexdsp-dev \
            libudev-dev libv4l-dev libva-dev libpci-dev libdrm-dev \
            nlohmann-json3-dev libwebsocketpp-dev libasio-dev libqrcodegencpp-dev \
            librist-dev libsrt-openssl-dev \
            qt6-base-dev libqt6svg6-dev qt6-base-private-dev \
            libffmpeg-nvenc-dev libvpl-dev libvpl2

      - name: Configure 🛠️
        run: |
          : Configure 🛠️
          source packaging/ci.sh
          # /usr, not CMake's default /usr/local: a distribution package must
          # not install into the admin's prefix.
          ci_run cmake --preset ubuntu-ci \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DOBS_VERSION_OVERRIDE=${{ needs.version.outputs.version }} \
            -DWEBMIX_PACKAGE_NAME=webmix \
            -DENABLE_BROWSER=OFF \
            -DENABLE_SCRIPTING=OFF \
            -DENABLE_VLC=OFF

      - name: Build 🧱
        run: |
          : Build 🧱
          source packaging/ci.sh
          ci_run cmake --build build_ubuntu --parallel

      - name: Package 📀
        run: |
          : Package 📀
          packaging/deb/package-deb.sh build_ubuntu dist

      - name: Verify the package 🔎
        run: |
          : Verify the package 🔎
          deb="$(ls dist/webmix_[0-9]*_amd64.deb)"
          dpkg-deb -I "${deb}" >/dev/null
          dpkg-deb -c "${deb}" >contents.txt
          check() {
            if grep -qE "$2" contents.txt; then
              echo "ok   $1"
            else
              echo "::error::$1: nothing matching /$2/ in ${deb}"
              exit 1
            fi
          }
          # The plugin directory name depends on the OBS version (obs-modules
          # after the 33.0 rename), so only the file name is asserted.
          check 'installs obs' 'usr/bin/obs$'
          check 'installs the webmix launcher' 'usr/bin/webmix -> obs'
          check 'ships the web frontend' 'usr/share/obs-studio/web/index.html'
          check 'ships obs-websocket' '/obs-websocket\.so$'

      - name: Upload artifacts 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb
          path: dist/*
          if-no-files-found: error

  arch:
    name: Arch Linux 🐧
    runs-on: ubuntu-24.04
    needs: version
    container:
      image: archlinux:latest
      options: --user root
    steps:
      - name: Prepare the build user 👤
        run: |
          : Prepare the build user 👤
          pacman -Syu --noconfirm --needed base-devel git sudo
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build the package and the repository 🧱
        run: |
          : Build the package and the repository 🧱
          # makepkg refuses to run as root, and the checkout is owned by root.
          chown -R builder:builder "${GITHUB_WORKSPACE}"
          source packaging/ci.sh
          ci_run su builder -c "cd '${GITHUB_WORKSPACE}' && packaging/arch/build-package.sh '${GITHUB_WORKSPACE}/dist'"

      - name: Verify the package 🔎
        run: |
          : Verify the package 🔎
          # webmix-debug is built as well; [0-9] picks the package, not the debug one.
          pkg="$(ls dist/webmix-[0-9]*.pkg.tar.zst)"
          pacman -Qip "${pkg}" >info.txt
          pacman -Qlp "${pkg}" >contents.txt
          check() {
            if grep -qE "$2" "$3"; then
              echo "ok   $1"
            else
              echo "::error::$1: nothing matching /$2/ in $3"
              exit 1
            fi
          }
          check 'named webmix' '^Name.*: webmix' info.txt
          check 'installs obs' 'usr/bin/obs$' contents.txt
          check 'installs the webmix launcher' 'usr/bin/webmix' contents.txt
          check 'ships the web frontend' 'usr/share/obs-studio/web/index.html' contents.txt
          check 'ships obs-websocket' '/obs-websocket\.so$' contents.txt
          check 'repository lists the package' 'webmix-0\.1\.0' <(tar -tzf dist/webmix.db.tar.gz)

      - name: Upload artifacts 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch
          path: |
            dist/webmix-*.pkg.tar.zst
            dist/webmix.db
            dist/webmix.db.tar.gz
            dist/webmix.files
            dist/webmix.files.tar.gz
          if-no-files-found: error

  windows:
    name: Windows 🪟
    runs-on: windows-2025-vs2026
    needs: version
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build dependencies 🛍️
        shell: pwsh
        run: |
          Get-ChildItem -Path .github/scripts/utils.pwsh/*.ps1 -Recurse | ForEach-Object { . $_.FullName }
          Install-BuildDependencies -WingetFile ".github/scripts/.Wingetfile"
          # Install-BuildDependencies only extends this process' PATH; the build
          # steps run in their own, so hand the directories to $GITHUB_PATH.
          foreach ($tool in @('Cmake\bin', '7-Zip')) {
            foreach ($prefix in @($env:ProgramFiles, ${env:ProgramFiles(x86)})) {
              $path = Join-Path $prefix $tool
              if (Test-Path $path) { $path | Out-File -FilePath $env:GITHUB_PATH -Append }
            }
          }
          cmake --version

      - name: Configure 🛠️
        shell: pwsh
        env:
          GPU_PRIORITY_VAL: '2'
        run: |
          . packaging/ci.ps1
          $code = Invoke-CiCommand cmake @(
            '--preset', 'windows-ci-x64',
            '-DOBS_VERSION_OVERRIDE=${{ needs.version.outputs.version }}',
            '-DWEBMIX_PACKAGE_NAME=webmix',
            '-DENABLE_BROWSER=OFF',
            '-DENABLE_SCRIPTING=OFF'
          )
          exit $code

      - name: Build 🧱
        shell: pwsh
        run: |
          . packaging/ci.ps1
          exit (Invoke-CiCommand cmake @(
            '--build', '--preset', 'windows-x64', '--config', 'RelWithDebInfo', '--parallel'
          ))

      - name: Install 📥
        shell: pwsh
        run: |
          . packaging/ci.ps1
          exit (Invoke-CiCommand cmake @(
            '--install', 'build_x64', '--prefix', 'build_x64/install', '--config', 'RelWithDebInfo'
          ))

      - name: Package 📀
        shell: pwsh
        run: |
          . packaging/ci.ps1
          exit (Invoke-CiCommand pwsh @(
            '-File', 'packaging/windows/package.ps1',
            '-BuildDir', 'build_x64', '-OutDir', 'dist', '-Configuration', 'RelWithDebInfo'
          ))

      - name: Verify the archive 🔎
        shell: pwsh
        run: |
          $zips = Get-ChildItem dist -Filter 'webmix-*.zip'
          if ($zips.Count -ne 1) { Write-Host "::error::expected one webmix-*.zip, found $($zips.Count)"; exit 1 }
          $zip = $zips[0]
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $names = $archive.Entries | ForEach-Object { $_.FullName }
            Write-Host "$($zip.Name) has $($names.Count) entries"
            $missing = @()
            # Windows builds the frontend as obs64.exe (frontend/CMakeLists.txt)
            foreach ($needed in @('bin/64bit/obs64.exe', 'obs-websocket.dll', 'data/obs-studio/web/index.html')) {
              if ($names -like "*$needed") {
                Write-Host "ok   $needed"
              } else {
                $missing += $needed
              }
            }
            if ($missing.Count -gt 0) {
              # Annotations are readable from outside the repository, so the
              # layout of a failing archive is visible without the logs.
              $names | Select-Object -First 40 | ForEach-Object { Write-Host "::notice::entry $_" }
              Write-Host "::error::$($zip.Name) is missing: $($missing -join ', ')"
              exit 1
            }
          } finally {
            $archive.Dispose()
          }

      - name: Upload artifacts 📡
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish 🚀
    runs-on: ubuntu-24.04
    needs: [version, deb, arch, windows]
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download the artifacts 📥
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.1
        with:
          merge-multiple: true
          path: dist

      - name: Publish 🚀
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: packaging/publish-release.sh "${VERSION}" dist
